<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devi & Juan — Wedding</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbf6ed}iframe{display:block;width:100%;height:100%;border:0}#veil{position:fixed;inset:0;background:#fbf6ed;z-index:9;display:grid;place-items:center;transition:opacity 1s ease}.v{text-align:center;color:#674936;font-family:Georgia,serif}.v .dj{font-size:70px;letter-spacing:-10px}.v small{display:block;letter-spacing:.28em;font:10px Arial;margin:18px}.v b{font:italic 24px Georgia}</style></head><body><div id="veil"><div class="v"><div class="dj">D & J</div><small>THE WEDDING OF</small><b>Devi & Juan</b></div></div><iframe id="site" src="index.html"></iframe><script>const f=document.getElementById('site'),v=document.getElementById('veil');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent=`section{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}section.show{opacity:1;transform:none}.cover{opacity:1!important;transform:none!important}.cover .eyebrow,.cover .mono,.cover .names,.cover .date,.cover .verse,.cover .open{animation:premiumIn 1.1s both}.cover .mono{animation-delay:.15s}.cover .names{animation-delay:.3s}.cover .date{animation-delay:.4s}.cover .verse{animation-delay:.55s}.cover .open{animation-delay:.8s}@keyframes premiumIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}/* Rapikan monogram cover: D & J tidak saling menumpuk */.cover .mono{font-size:112px!important;line-height:1!important;letter-spacing:-.04em!important;margin-top:18px!important;margin-bottom:22px!important;white-space:nowrap!important}.cover .mono em{font-size:50px!important;vertical-align:18px!important;margin:0 9px!important}.cover .names{margin-top:0!important}.gallery .photo{transition:transform .7s ease,opacity .7s ease}.gallery .photo:hover{transform:translateY(-3px)}.event,.gift,.count div,.person{transition:transform .5s ease,box-shadow .5s ease}.event:hover,.gift:hover,.count div:hover,.person:hover{transform:translateY(-5px);box-shadow:0 14px 28px #67493618}.signature{animation:premiumIn 1.2s both}@media(max-width:560px){section{padding:64px 16px}.cover .mono{font-size:98px!important;line-height:1!important;letter-spacing:-.03em!important;margin-top:16px!important;margin-bottom:22px!important}.cover .mono em{font-size:45px!important;vertical-align:16px!important;margin:0 7px!important}.cover .names{font-size:18px!important;letter-spacing:.3em!important}}`;d.head.appendChild(s);const sections=[...d.querySelectorAll('main section')];const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.14});sections.forEach(x=>io.observe(x));setTimeout(()=>v.classList.add('hide'),900)}catch(e){v.classList.add('hide')}});</script></body></html>
